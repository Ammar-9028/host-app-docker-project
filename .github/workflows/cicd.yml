name: NestHost ECR CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -W ignore -m unittest discover -s tests -v

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 289829300853.dkr.ecr.us-east-2.amazonaws.com/ammar-repo:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.IPADDRESS }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd ~/host-app-docker-project
            export APP_IMAGE=289829300853.dkr.ecr.us-east-2.amazonaws.com/ammar-repo:latest
            aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 289829300853.dkr.ecr.us-east-2.amazonaws.com
            docker pull $APP_IMAGE
            docker compose up -d --no-build --no-deps app
