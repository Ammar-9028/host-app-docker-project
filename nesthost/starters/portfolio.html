<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[[title]]</title><meta name="description" content="[[tagline]]"><style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:#0d0b1f;color:#eee;line-height:1.7;overflow-x:hidden}.o{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:f 14s ease-in-out infinite alternate}.o1{width:50vmax;height:50vmax;background:#6d28d9;left:-15vmax;top:-15vmax}.o2{width:40vmax;height:40vmax;background:#ec4899;right:-12vmax;bottom:-10vmax;animation-delay:-6s}@keyframes f{to{transform:translate(6vmax,4vmax)}}
header{min-height:92vh;display:grid;place-content:center;text-align:center;padding:2rem}.av{width:96px;height:96px;margin:0 auto 1.2rem;border-radius:50%;display:grid;place-items:center;font:700 2.4rem system-ui;background:linear-gradient(135deg,#8b5cf6,#ec4899)}h1{font-size:clamp(2.6rem,9vw,6rem);line-height:1;background:linear-gradient(100deg,#fff,#c4b5fd,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}.t{font-size:1.3rem;color:#c4b5fd;margin:1rem 0 2rem}a.b{display:inline-block;padding:.8rem 1.8rem;border-radius:99px;background:linear-gradient(100deg,#8b5cf6,#ec4899);color:#fff;text-decoration:none;font-weight:700}section{max-width:700px;margin:0 auto;padding:4rem 1.5rem}h2{margin-bottom:1rem;color:#c4b5fd}</style></head>
<body><i class="o o1"></i><i class="o o2"></i><header><div class="av">[[initial]]</div><h1>[[title]]</h1><p class="t">[[tagline]]</p><div><a class="b" href="mailto:[[email]]">Contact me</a></div></header><section><h2>About</h2><p>[[about]]</p></section></body></html>
