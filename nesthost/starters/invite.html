<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[[title]]</title><meta name="description" content="[[tagline]]"><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:grid;place-items:center;padding:1.2rem;background:radial-gradient(circle at 50% 0,#5a0f1f,#240509);font-family:"Cormorant Garamond",Georgia,serif;color:#fff1da;overflow-x:hidden}
.card{position:relative;max-width:560px;width:100%;text-align:center;padding:3.2rem 2rem;border:2px solid #e9c46a;border-radius:8px;outline:1px solid #e9c46a88;outline-offset:-14px;background:rgba(255,255,255,.04);animation:in 1.2s both}@keyframes in{from{opacity:0;transform:translateY(40px) scale(.96)}}
.k{letter-spacing:.3em;text-transform:uppercase;color:#e9c46a;font-size:.9rem}h1{font:400 clamp(3rem,12vw,5.2rem)/1.1 "Great Vibes",cursive;margin:1rem 0;background:linear-gradient(100deg,#e9c46a,#fff6d8,#e9c46a);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:s 5s linear infinite}@keyframes s{to{background-position:250%}}
.d{font-size:1.5rem;font-weight:700;margin:.5rem 0}p{font-size:1.25rem;margin:.8rem 0}a{display:inline-block;margin-top:1.2rem;padding:.7rem 1.8rem;border:1px solid #e9c46a;border-radius:99px;color:#e9c46a;text-decoration:none;letter-spacing:.1em;transition:.3s}a:hover{background:#e9c46a;color:#240509}.s{position:fixed;width:6px;height:6px;border-radius:50%;background:#e9c46a;animation:t 3s infinite}.s:nth-child(1){left:10%;top:20%}.s:nth-child(2){left:85%;top:30%;animation-delay:1s}.s:nth-child(3){left:20%;top:80%;animation-delay:2s}.s:nth-child(4){left:75%;top:85%;animation-delay:.5s}@keyframes t{50%{opacity:.1;transform:scale(2)}}</style></head>
<body><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><main class="card"><div class="k">You are invited</div><h1>[[title]]</h1><div class="d">[[tagline]]</div><p>[[about]]</p><a href="mailto:[[email]]?subject=RSVP">RSVP</a></main></body></html>
