<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[[title]]</title><meta name="description" content="[[tagline]]"><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:grid;place-items:center;padding:1.5rem;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#ffecd2,#fcb69f 50%,#ff9a9e);background-size:200% 200%;animation:g 12s ease infinite;color:#2d1b2e}@keyframes g{50%{background-position:100% 100%}}
main{width:min(420px,100%);text-align:center}.av{width:104px;height:104px;margin:0 auto 1rem;border-radius:50%;display:grid;place-items:center;font:800 2.6rem system-ui;color:#fff;background:linear-gradient(135deg,#7c3aed,#ec4899);box-shadow:0 12px 30px #7c3aed55;animation:b 3s ease-in-out infinite}@keyframes b{50%{transform:translateY(-6px)}}h1{font-size:1.8rem}p{margin:.4rem 0 1.4rem;opacity:.85}
a{display:block;margin:.7rem 0;padding:1rem;border-radius:16px;background:#fff;color:#2d1b2e;text-decoration:none;font-weight:700;box-shadow:0 6px 18px #0002;transition:.25s}a:hover{transform:translateY(-4px) scale(1.02)}</style></head>
<body><main><div class="av">[[initial]]</div><h1>[[title]]</h1><p>[[tagline]]</p><a href="mailto:[[email]]">Email me</a><a href="#about">About me</a><p id="about" style="margin-top:1.4rem">[[about]]</p></main></body></html>
