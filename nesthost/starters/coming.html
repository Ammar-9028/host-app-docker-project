<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[[title]]</title><meta name="description" content="[[tagline]]"><style>*{box-sizing:border-box;margin:0}body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:1.5rem;font-family:system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#1c1147,#5b2bd6 55%,#ff4d8d);background-size:200% 200%;animation:bg 10s ease infinite}@keyframes bg{50%{background-position:100% 100%}}
h1{font-size:clamp(2.4rem,8vw,5rem);line-height:1.05}p{max-width:30em;margin:1rem auto;opacity:.9;font-size:1.15rem}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#34d399;margin-right:.5rem;animation:p 1.4s infinite}@keyframes p{50%{opacity:.3;transform:scale(1.5)}}.tag{display:inline-block;margin-top:1rem;padding:.4rem 1rem;border:1px solid #fff6;border-radius:99px}</style></head>
<body><main><h1>[[title]]</h1><p>[[tagline]]</p><span class="tag"><i class="dot"></i>Coming soon</span></main></body></html>
