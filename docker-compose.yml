services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes: ["nest_data:/data"]
    expose: ["8000"]            # only Caddy can reach the app
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env
    volumes:
      - ./deploy/${CADDYFILE:-Caddyfile.http}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  nest_data:
  caddy_data:
  caddy_config:
